# The template repository's own tooling, locked in uv.lock: template-ci and
# local maintenance (CLAUDE.md, "Making changes") run copier, ruff and the
# scripts/ test suite from this environment instead of resolving whatever is
# newest on each run (#694).  Not a package, and never rendered: copier gives
# pyproject.toml.jinja precedence, and uv.lock is in copier.yml's _exclude.
[project]
name = "fastmcp-server-template-tooling"
version = "0"
requires-python = ">=3.11"
dependencies = [
    "copier",
    "ruff",
    "pytest",
    "pytest-cov",
    "pyyaml",
    "jsonschema",
    "jinja2",
    "mypy",
    "types-pyyaml",
    "types-jsonschema",
    # Must equal the fastmcp-pvl-core pin in pyproject.toml.jinja;
    # scripts/tests/test_tooling_env.py holds the two together.
    "fastmcp-pvl-core>=10.1.0,<11",
]

[tool.uv]
package = false

# Coverage of the template's own Python, for the `sonar` job in template-ci.
# Relative paths keep coverage.xml valid in the job that scans it.
[tool.coverage.run]
# Source directories, so a script the tests only run as a subprocess is still
# listed (at 0%).  With relative_files the report's <source> entries are these
# paths and each filename is relative to one; SonarQube Cloud resolves that
# against the checkout, as fastmcp-pvl-core's scan does.
source = ["scripts", ".github/actions/build-plugin-zip"]
omit = ["scripts/tests/*"]
branch = true
relative_files = true
